<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <meta
      name="description"
      content="Convert Celsius to Fahrenheit and Kelvin instantly. No tracking, no accounts."
    />
    <meta name="theme-color" content="#f5f5f7" />
    <meta name="referrer" content="no-referrer" />
    <title>Temperature Converter</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <main class="page">
      <div class="card">
        <h1 class="card__heading">Temperature Converter</h1>

        <div class="field">
          <label class="field__label" for="celsius-input">Celsius (°C)</label>
          <input
            id="celsius-input"
            class="field__input"
            type="text"
            inputmode="decimal"
            autocomplete="off"
            maxlength="32"
            enterkeyhint="done"
            placeholder="e.g. 100"
            spellcheck="false"
            autocorrect="off"
            autocapitalize="none"
            aria-describedby="celsius-helper celsius-error"
          />
          <p id="celsius-helper" class="field__helper">
            Decimals and negatives OK. Use &ldquo;.&rdquo; as the decimal point.
          </p>
          <p id="celsius-error" class="field__error" hidden aria-live="polite"></p>
        </div>

        <p id="celsius-hint" class="hint" role="status">Enter a temperature in Celsius</p>

        <dl class="results">
          <div class="results__row">
            <dt class="results__label">Fahrenheit (°F)</dt>
            <dd id="fahrenheit-output" class="results__value">—</dd>
          </div>
          <div class="results__row">
            <dt class="results__label">Kelvin (K)</dt>
            <dd id="kelvin-output" class="results__value">—</dd>
          </div>
        </dl>
      </div>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
